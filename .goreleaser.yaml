# goreleaser — PORT_SPEC.md §8 (Distribution) and §7.3 (wheels).
#
# "Out: PyInstaller, Nuitka, Python version drift on user machines. In:
#  CGO_ENABLED=0 static binaries, cross-compilation, goreleaser."
#
# Driven by .github/workflows/release.yml.  Keep the two in step: the workflow
# runs `goreleaser release --snapshot`, so nothing in this file may depend on a
# publishing token to be *valid* — only to be *used*.
#
# ---------------------------------------------------------------------------
# VERSION STAMPING CONVENTION — the Go side must match this.
# ---------------------------------------------------------------------------
# PACKAGE_GRAPH.md §2.1 maps Python's `Kathara/version.py` CURRENT_VERSION to
# "ldflags-injected in cmd/kathara".  Concretely, `package main` in ./cmd/kathara
# declares:
#
#     var (
#         version = "dev"        // -X main.version
#         commit  = "none"       // -X main.commit
#         date    = "unknown"    // -X main.date
#     )
#
# Rules that make this load-bearing rather than decorative:
#
#   * The variables live in `package main`, not in internal/util.  `-X` only
#     reaches a package the linker actually links under that exact import path;
#     `main` is the one path that never moves.  internal/util/version.go keeps
#     Python's tuple-compare `Parse`/`LessThan` semantics and takes the string
#     as an argument — it does not own it.
#
#   * `{{ .Version }}` is the git tag WITHOUT its leading "v" (`{{ .Tag }}` keeps
#     it).  That is deliberate: CLI_SURFACE.md §48 pins the output of
#     `kathara -v` to `Current version: 3.8.3` — Python's
#     `'Current version: %s' % CURRENT_VERSION`.  A stamped "v3.8.3" would be a
#     silent golden diff on every run.
#
#   * The default when nobody stamps anything is "dev", never "" — an empty
#     version prints `Current version: ` and reads as a broken build rather than
#     an unstamped one.
#
#   * JSON_CLI_CONTRACT.md §"check" emits this same string as
#     `kathara_version`, alongside `runtime_version` (the Go runtime, from
#     runtime.Version(), NOT stamped here).

version: 2

project_name: kathara

before:
  hooks:
    - go mod download

builds:
  - id: kathara
    main: ./cmd/kathara
    binary: kathara
    env:
      # §8's whole point: no C toolchain anywhere in the distribution path,
      # because there is no C extension to build.  Note this is the RELEASE
      # setting only — `go test -race` in ci.yml needs CGO_ENABLED=1.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    # Commit time rather than build time, so two builds of one tag are
    # byte-identical.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Five platform/arch combinations, matching PORT_SPEC.md §7.3 ("goreleaser
      # builds five binaries") and the five CI runners in ci.yml.  windows/arm64
      # is the deliberate omission: no CI runner exercises it, and shipping an
      # untested binary is worse than not shipping one.
      - goos: windows
        goarch: arm64

archives:
  - id: kathara
    ids:
      - kathara
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Lowercase, underscore-separated, arch spelled the Go way (amd64/arm64) so
    # the wheel builder in §7.3 can map platform tags mechanically.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  # Untagged builds get an obviously-not-a-release version.
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Stated rather than sniffed from `git remote`: it matches the module path in
  # go.mod, it keeps `goreleaser check` valid in a worktree or a fresh clone with
  # no remote, and it means a fork can never accidentally publish here.
  github:
    owner: KatharaFramework
    name: kathara-go
  # Snapshot builds never reach this block.  It stays configured but inert until
  # the signing question below is answered, because an unsigned release is worse
  # than no release: Gatekeeper quarantines it and SmartScreen warns on it, and
  # users read that as "Kathara is malware" rather than "the maintainers have not
  # bought a certificate yet".
  draft: true
  prerelease: auto

# ---------------------------------------------------------------------------
# NOT CONFIGURED, ON PURPOSE.
# ---------------------------------------------------------------------------
# Code signing — PORT_SPEC.md §8: "Budget for code signing. An unsigned Go binary
# is quarantined by Gatekeeper and warned about by SmartScreen exactly like a
# PyInstaller one. This needs an Apple Developer account and a Windows signing
# certificate, and the language change does not fix it."
#
# There is no Apple Developer account and no Windows certificate for this project
# yet, and no repository secrets holding either.  A `signs:`/`notarize:` block
# written against invented secret names would be worse than this comment: it
# would fail every release run, or — if someone added `|| true` to get past it —
# emit binaries that look signed and are not.  So: nothing here until the
# credentials exist.
#
# When they do, the shape is:
#   * macOS: `notarize.macos` with an Apple Developer ID Application certificate
#     (base64 P12 + password) and an App Store Connect API key (issuer ID, key
#     ID, .p8).  Both the darwin/amd64 and darwin/arm64 archives must be signed
#     and notarized, then stapled.
#   * Windows: Authenticode over the windows/amd64 binary BEFORE it is archived
#     (signtool, or Azure Trusted Signing).  An EV or Azure-issued certificate
#     clears SmartScreen immediately; an OV certificate needs reputation to
#     accumulate first, so plan the cutover date around that, not around the
#     release date.
#   * The Inno Setup installer (§8: kept and repointed) signs separately from the
#     binary; signing only one of them still trips SmartScreen.
#
# Linux packaging — §8 keeps deb/rpm, the Launchpad PPA, the Homebrew cask and
# the .ronn man pages.  An `nfpms:` block is the natural home for deb/rpm here
# and is genuinely "much simpler" now, but it requires real maintainer identity
# (name and address that end up in package metadata and PPA uploads), so it is
# left for the human who owns those.  Same for `brews:` — it needs the tap
# repository name and push credentials.
