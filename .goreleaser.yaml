# GoReleaser builds the five supported static binaries used by the standalone
# archives and Python wheels. Release tags override cmd/kathara.version; local
# builds retain the 3.8.3 compatibility baseline from internal/util.

version: 2

project_name: kathara

before:
  hooks:
    - go mod download

builds:
  - id: kathara
    main: ./cmd/kathara
    binary: kathara
    env:
      # Release binaries are static. `go test -race` in ci.yml still needs
      # CGO_ENABLED=1.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    # Commit time rather than build time, so two builds of one tag are
    # byte-identical.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Five platform/arch combinations, matching the five CI runners.
      # Windows/arm64 is the deliberate omission: no CI runner exercises it,
      # and shipping an
      # untested binary is worse than not shipping one.
      - goos: windows
        goarch: arm64

archives:
  - id: kathara
    ids:
      - kathara
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Go-style OS and architecture names let the wheel builder map platform
    # tags mechanically.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  # Untagged builds get an obviously-not-a-release version.
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: KatharaFramework
    name: kathara-go
  draft: true
  prerelease: auto

# The current workflow creates snapshot artifacts and does not publish releases.
