# Build snapshot binaries and Python wheels without publishing a release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  snapshot:
    name: goreleaser snapshot (5 platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser derives the version and changelog from tag history;
          # a shallow checkout silently yields the wrong version.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      # Cross-compilation with no C toolchain in sight — CGO_ENABLED=0 is set
      # per-build in .goreleaser.yaml so it applies to the local `goreleaser
      # build` invocation a maintainer runs too, not only to CI.
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Artifact inventory
        run: |
          ls -la dist/
          cat dist/checksums.txt
          # Linux and macOS on amd64/arm64, plus Windows on amd64.
          count="$(find dist -type f \( -name kathara -o -name kathara.exe \) | wc -l)"
          echo "binaries built: $count"
          test "$count" -eq 5

      - name: Upload binaries and archives
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 14
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # Python wheels are built from the same five GoReleaser binaries so the
      # wheel and standalone archive always contain identical executables.
      # -----------------------------------------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build platform wheels
        run: |
          python -m pip install --upgrade pip hatchling
          python python/build_wheels.py --dist dist --out python/dist
          ls -la python/dist/
          # One wheel per GoReleaser binary.
          test "$(find python/dist -name '*.whl' | wc -l)" -eq 5

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: python/dist/*.whl
          retention-days: 14
          if-no-files-found: error
