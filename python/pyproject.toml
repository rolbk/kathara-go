[project]
name = "kathara"
dynamic = ["version"]
description = "A lightweight container-based network emulation tool."
readme = "README.md"
requires-python = ">=3.10"
license = 'gpl-3.0'
license-files = ["LICENSE"]
keywords = ["NETWORK-EMULATION", "CONTAINERS", "NFV"]
authors = [
    { name = "Kathara Framework", email = "contact@kathara.org" }
]

maintainers = [
    { name = "Tommaso Caiazzi", email = "contact@kathara.org" },
    { name = "Mariano Scazzariello", email = "contact@kathara.org" },
    { name = "Lorenzo Ariemma", email = "contact@kathara.org" },
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Telecommunications Industry",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

# The Python client only depends on packages needed by its model layer. Backend,
# HTTP, terminal, and platform SDKs belong to the static Go CLI.
#
#   fs           — provides the public `Lab.fs` and `Machine.fs` interfaces,
#                  including in-memory filesystems.
#   setuptools   — NOT a build dependency: `fs` 2.4.16 calls
#                  `pkg_resources.declare_namespace` at import time, and
#                  setuptools >= 81 removed pkg_resources. Same pin as v3.8.3,
#                  and still load-bearing for the same reason.
#   binaryornot  — used by `utils.convert_win_2_linux`, `Machine.pack_data`,
#                  and `utils.pack_file_for_tar`.
#
# `chardet` is deliberately absent: an audit of the client code found its only
# v3.8.3 consumer was `cli/command/ExecCommand.py`'s per-chunk decode, which is
# now handled by the binary using UTF-8 with replacement characters.
dependencies = [
    "fs>=2.4.16",
    "setuptools<81",
    "binaryornot>=0.4.4",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
"Homepage" = "https://www.kathara.org"
"Bug Reports" = "https://github.com/KatharaFramework/Kathara/issues"
"Source" = "https://github.com/KatharaFramework/kathara-go"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One source of truth for the version: `Kathara/version.py`, which is also what
# `Kathara.version.CURRENT_VERSION` reports at runtime. `build_wheels.py
# --version` rewrites that file for the duration of a release build so the
# wheel, the metadata and the runtime constant cannot disagree.
[tool.hatch.version]
path = "Kathara/version.py"
pattern = "CURRENT_VERSION\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["Kathara"]

[tool.hatch.build.targets.sdist]
include = [
    "/Kathara",
    "/tests",
    "/build_wheels.py",
    "/README.md",
    "/LICENSE",
]
