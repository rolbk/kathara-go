pc1[0]=A
pc1[image]="kathara/frr"
pc1[mem]=512m
pc1[cpus]=1.5
pc1[shell]=/bin/bash
pc1[ipv6]=true
pc1[bridged]=true
pc1[privileged]=1
pc1[num_terms]=2
pc1[entrypoint]="/bin/sh -c"
pc1[args]="--foo bar"
pc1[exec]=echo one
pc1[exec]=echo two
pc1[sysctl]=net.ipv4.ip_forward=1
pc1[sysctl]=net.ipv6.conf.all.forwarding=0
pc1[sysctl]="net.ipv4.conf.all.rp_filter=-1"
pc1[sysctl]=net.custom.value=abc
pc1[env]=FOO=bar
pc1[env]=EMPTY=
pc1[port]="1000:2000/udp"
pc1[port]=4000
pc1[port]="5000/sctp"
pc1[port]="6000:7000/TCP"
pc1[ulimit]=nofile=1024
pc1[ulimit]=nproc=100:200
pc1[ulimit]=memlock=-1:-1
pc1[ulimit]=stack=300:200
pc1[ulimit]=core=5:-1
pc1[volume]=/host/a|/guest/a|rw
pc1[volume]=/host/b|/guest/b
pc1[volume]=/host/c|/guest/c|rx
