# Covers the `volume` device option: the 3-part form with an explicit mode and
# the 2-part form that defaults to `ro`. The host paths are absolute because
# Machine.add_meta runs os.path.abspath against the process cwd; the daemon
# creates them if missing.
pc1[0]="A"
pc1[volume]="/tmp/kathara-golden-vol-rw|/guest-rw|rw"
pc1[volume]="/tmp/kathara-golden-vol-ro|/guest-ro"
